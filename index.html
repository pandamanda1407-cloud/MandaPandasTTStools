<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MandaPanda TTS Voice Library</title><style>body{font:16px system-ui;background:#100b1b;color:#f5efff;margin:0}main{max-width:940px;margin:auto;padding:24px}h1{color:#d8b5ff}input,select,button{background:#251638;color:white;border:1px solid #70518c;border-radius:9px;padding:11px;font:inherit}button{cursor:pointer}button:hover{background:#493066}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.controls>*{flex:1;min-width:140px}.item{background:#1d142c;border:1px solid #3e2c54;border-radius:12px;padding:15px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#c1afcf;font-size:14px}.actions{display:flex;gap:8px}a{color:#dfb7ff}small{color:#bda9cc}</style><main><h1>💜 MandaPanda TTS Voice Library</h1><p>Browse English and character voices for stream requests. This directory is being built; samples must come from BetterTok itself.</p><div class="controls"><input id="search" placeholder="Search voices"><select id="gender"><option value="">Any gender</option><option>Female</option><option>Male</option><option>Other</option></select><select id="accent"><option value="">Any accent</option><option>US</option><option>UK</option><option>Australian</option><option>Other</option></select><select id="kind"><option value="">All types</option><option>Natural</option><option>Character</option><option>Novelty</option></select></div><div class="controls"><button id="all">Play All Filtered</button><button id="stop">Stop</button><button id="faves">Show favorites only: Off</button></div><p id="status" class="muted"></p><section id="voices"></section><p class="muted">No audio is included until actual BetterTok samples are verified. Try the <a href="https://bettertok.app/tools/tts-tester" target="_blank" rel="noopener">official BetterTok tester</a> meanwhile.</p></main><script>const voices=[];const $=x=>document.getElementById(x);let favorites=new Set(JSON.parse(localStorage.getItem('mp-favorites')||'[]')),only=false,audio=null;function filtered(){return voices.filter(v=>(!$('search').value||v.name.toLowerCase().includes($('search').value.toLowerCase()))&&(!$('gender').value||v.gender===$('gender').value)&&(!$('accent').value||v.accent===$('accent').value)&&(!$('kind').value||v.kind===$('kind').value)&&(!only||favorites.has(v.name)))}function render(){let vs=filtered();$('status').textContent=vs.length?vs.length+' voices shown':'No verified voice samples added yet.';$('voices').replaceChildren();vs.forEach(v=>{let el=document.createElement('div');el.className='item';let label=document.createElement('div');label.textContent=v.name+' · '+v.accent+' · '+v.gender+' · '+v.kind;let actions=document.createElement('div');actions.className='actions';let play=document.createElement('button');play.textContent='▶ Play';play.disabled=!v.audio;play.onclick=()=>playOne(v);let fav=document.createElement('button');fav.textContent=favorites.has(v.name)?'♥':'♡';fav.onclick=()=>{favorites.has(v.name)?favorites.delete(v.name):favorites.add(v.name);localStorage.setItem('mp-favorites',JSON.stringify([...favorites]));render()};actions.append(play,fav);el.append(label,actions);$('voices').append(el)})}function playOne(v){if(audio)audio.pause();audio=new Audio(v.audio);audio.play()}$('all').onclick=async()=>{for(const v of filtered()){if(!v.audio)continue;playOne(v);await new Promise(resolve=>{audio.onended=resolve;audio.onerror=resolve})}};$('stop').onclick=()=>{if(audio)audio.pause()};$('faves').onclick=()=>{only=!only;$('faves').textContent='Show favorites only: '+(only?'On':'Off');render()};['search','gender','accent','kind'].forEach(id=>$(id).addEventListener('input',render));render();</script></html>
